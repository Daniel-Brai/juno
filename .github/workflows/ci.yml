name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv python install

      - run: uv sync --locked --all-groups

      - run: make check

      - run: uv run prek run --all-files --show-diff-on-failure
