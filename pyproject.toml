[project]
name = "juno"
version = "0.1.0"
description = "Your headless agent harness for long-running tasks and everyday coding. Give it a goal, walk away, and come back to finished work."
license = "MIT"
authors = [{ name = "Daniel Brai", email = "danielbrai.dev@gmail.com" }]
keywords = ["agent", "harness", "llm", "machine-learning", "automation", "asyncio"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",

    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",

    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.15",

    "Operating System :: POSIX :: Linux",

    "Framework :: AsyncIO",

    "Topic :: Scientific/Engineering :: Artificial Intelligence",

    "Typing :: Typed",
]

requires-python = ">=3.15"
dependencies = [
    "aiosqlite>=0.22.1",
    "anthropic>=2.3.0",
    "cyclopts>=5.3.2",
    "httpx>=0.28.1",
    "nvidia-ml-py>=13.615.71",
    "psutil>=7.2.2",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "structlog>=26.1.0",
]


[project.scripts]
juno = "juno.entrypoints.cli:app"


[dependency-groups]
test = [
    "anyio>=4.15.1",
    "coverage>=7.17.0",
    "hypothesis>=6.170.14",
    "pytest>=9.2.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "respx>=0.23.1",
]
lint = [
    "git-changelog>=2.10.0",
    "import-linter>=2.15",
    "mypy==2.4.1",
    "prek>=0.5.9",
    "pyright==1.1.414",
    "ruff==0.17.3",
    "types-psutil>=7.2.2.20260906",
]


[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"


[tool.uv]
default-groups = ["test", "lint"]


[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "RUF", "ASYNC", "PTH", "S", "TID"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ARG", "S603", "S607"]
"src/juno/adapters/sandboxes/*.py" = ["S603", "S607"]
"src/juno/adapters/git.py" = ["S603", "S607"]
"src/juno/config.py" = ["ARG003"]
"src/juno/eval/stats.py" = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["juno", "fakes"]

[tool.ruff.format]
docstring-code-format = true


[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pynvml"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true


[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"


[tool.importlinter]
root_package = "juno"

[[tool.importlinter.contracts]]
name = "Domain stays pure"
type = "forbidden"
source_modules = ["juno.domain"]
forbidden_modules = ["juno.ports", "juno.config"]

[[tool.importlinter.contracts]]
name = "Ports do not depend on config"
type = "forbidden"
source_modules = ["juno.ports"]
forbidden_modules = ["juno.config"]

[[tool.importlinter.contracts]]
name = "Only bootstrap wires adapters"
type = "forbidden"
source_modules = ["juno.domain", "juno.ports", "juno.config", "juno.service", "juno.tools"]
forbidden_modules = ["juno.adapters", "juno.bootstrap"]

[[tool.importlinter.contracts]]
name = "Eval reads runs, it does not drive them"
type = "forbidden"
source_modules = ["juno.eval"]
forbidden_modules = ["juno.service", "juno.tools", "juno.adapters", "juno.bootstrap", "juno.entrypoints"]


[tool.pytest.ini_options]
addopts = "--strict-markers -ra"
testpaths = ["tests"]
pythonpath = ["tests"]
timeout = 60
markers = [
    "slow: long-running tests",
    "gpu: needs an NVIDIA GPU, run with --gpu",
    "live_api: calls the real model API, run with --live",
    "e2e: end-to-end runs through the CLI",
]


[tool.coverage.run]
source = ["juno"]
branch = true
parallel = true
concurrency = ["thread", "multiprocessing"]

[tool.coverage.report]
show_missing = true
skip_covered = true
